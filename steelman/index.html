<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STEELMAN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0c0c0c;
      --surface:   #111111;
      --elevated:  #181818;
      --border:    rgba(255,255,255,0.07);
      --border-hi: rgba(255,255,255,0.16);
      --muted:     #333333;
      --subtle:    #666666;
      --text:      #e2e2e2;
      --bright:    #f5f5f5;
      --silver:    #b8b8b8;
      --red:       #c0392b;
      --red-hi:    #e74c3c;
      --font:      'Inter', -apple-system, "SF Pro Display", sans-serif;
    }

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Screens ── */
    .screen { display: none; min-height: 100vh; }
    .screen.active { display: flex; }

    /* ═══════════════ LANDING ═══════════════ */
    #screen-landing {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      text-align: center;
      padding: 60px 24px;
      position: relative;
      overflow: hidden;
    }

    #screen-landing::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 55% at 50% 45%,
        rgba(192,57,43,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .landing-logo {
      width: 160px;
      height: 185px;
      margin-bottom: 36px;
      filter:
        drop-shadow(0 0 32px rgba(192,57,43,0.28))
        drop-shadow(0 12px 40px rgba(0,0,0,0.7));
    }

    .wordmark {
      font-size: clamp(32px, 7vw, 52px);
      font-weight: 700;
      letter-spacing: 10px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #777 0%, #ccc 35%, #f0f0f0 50%, #bbb 65%, #777 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }

    .tagline {
      font-size: 15px;
      font-weight: 300;
      color: var(--subtle);
      letter-spacing: 2px;
      margin-bottom: 44px;
    }

    /* ═══════════════ SETUP ═══════════════ */
    #screen-setup {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }

    .setup-card {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 26px;
    }

    .setup-logo-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }

    .setup-logo-bar svg { width: 28px; height: 32px; }

    .setup-logo-bar .mark {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 4px;
      color: var(--silver);
    }

    .setup-header h2 {
      font-size: 20px;
      font-weight: 600;
      color: var(--bright);
      letter-spacing: -0.2px;
      margin-bottom: 6px;
    }

    .setup-header p {
      font-size: 13px;
      color: var(--subtle);
      line-height: 1.6;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--subtle);
    }

    .field input,
    .field textarea {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      padding: 11px 14px;
      width: 100%;
      transition: border-color 0.15s;
      resize: none;
      outline: none;
      border-radius: 2px;
    }

    .field input::placeholder,
    .field textarea::placeholder { color: var(--muted); }

    .field input:focus,
    .field textarea:focus { border-color: var(--border-hi); }

    /* ═══════════════ CHAT ═══════════════ */
    #screen-chat {
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--surface);
    }

    .chat-header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .chat-header-left svg { width: 22px; height: 26px; flex-shrink: 0; }

    .chat-header-brand { font-size: 11px; font-weight: 700; letter-spacing: 3.5px; color: var(--silver); }

    .chat-sep { width: 1px; height: 18px; background: var(--border); }

    .chat-header-ctx {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .chat-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--bright);
    }

    .chat-subtitle {
      font-size: 11px;
      color: var(--subtle);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      gap: 0;
      scroll-behavior: smooth;
    }

    @media (min-width: 700px) { .chat-messages { padding: 32px 48px; } }

    .chat-messages::-webkit-scrollbar { width: 3px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }

    .msgs-center {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    .msg-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 30px;
    }

    .msg-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 7px;
    }

    .msg {
      max-width: 80%;
      padding: 12px 16px;
      font-size: 14px;
      line-height: 1.65;
      border-radius: 2px;
    }

    .msg-user {
      align-self: flex-end;
      background: var(--elevated);
      border: 1px solid var(--border);
      color: var(--text);
      margin-bottom: 20px;
    }

    .msg-user-label { align-self: flex-end; }

    .msg-ai {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--silver);
      margin-bottom: 10px;
    }

    /* Coaching note */
    .msg-coaching {
      align-self: flex-start;
      max-width: 80%;
      background: #0f0f0f;
      border-left: 2px solid var(--red);
      padding: 12px 16px;
      font-size: 13px;
      line-height: 1.65;
      border-radius: 0 2px 2px 0;
    }

    .coaching-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--red-hi);
      margin-bottom: 10px;
    }

    .coaching-section {
      display: flex;
      gap: 10px;
      margin-bottom: 7px;
      color: #777;
      align-items: flex-start;
    }
    .coaching-section:last-child { margin-bottom: 0; }

    .coaching-icon { flex-shrink: 0; font-style: normal; margin-top: 1px; }
    .coaching-icon.landed { color: #5a9a5a; }
    .coaching-icon.weak   { color: var(--red-hi); }
    .coaching-icon.fix    { color: var(--silver); }

    .coaching-text { font-size: 13px; line-height: 1.6; }

    /* Typing */
    .typing-indicator {
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 12px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
      margin-bottom: 16px;
    }

    .typing-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--muted);
      animation: pulse 1.2s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50%       { opacity: 1;   transform: scale(1); }
    }

    .chat-footer {
      border-top: 1px solid var(--border);
      padding: 14px 24px;
      flex-shrink: 0;
      background: var(--surface);
    }

    .chat-input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      max-width: 680px;
      margin: 0 auto;
    }

    #chat-input {
      flex: 1;
      background: var(--elevated);
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      padding: 10px 14px;
      resize: none;
      outline: none;
      max-height: 120px;
      overflow-y: auto;
      transition: border-color 0.15s;
    }
    #chat-input:focus { border-color: var(--border-hi); }
    #chat-input::placeholder { color: var(--muted); }

    /* ═══════════════ SUMMARY ═══════════════ */
    #screen-summary {
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 48px 24px;
      overflow-y: auto;
    }

    .summary-card {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      padding-bottom: 48px;
    }

    .summary-eyebrow {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--red-hi);
      margin-bottom: 8px;
    }

    .summary-header h2 {
      font-size: 24px;
      font-weight: 700;
      color: var(--bright);
      letter-spacing: -0.3px;
    }

    .summary-header p {
      font-size: 13px;
      color: var(--subtle);
      margin-top: 6px;
    }

    .summary-body {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 22px;
      font-size: 14px;
      line-height: 1.8;
      color: var(--text);
      white-space: pre-wrap;
    }

    .summary-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-start;
    }

    /* ═══════════════ BUTTONS ═══════════════ */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: var(--font);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      border: none;
      outline: none;
      border-radius: 2px;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-primary {
      background: transparent;
      color: var(--silver);
      border: 1px solid rgba(192,57,43,0.5);
      padding: 13px 32px;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .btn-primary:hover:not(:disabled) {
      background: rgba(192,57,43,0.1);
      border-color: var(--red-hi);
      color: var(--bright);
    }

    .btn-secondary {
      background: transparent;
      color: var(--subtle);
      border: 1px solid var(--border);
      padding: 10px 20px;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .btn-secondary:hover:not(:disabled) {
      border-color: var(--border-hi);
      color: var(--text);
    }

    .btn-danger {
      background: transparent;
      color: var(--subtle);
      border: 1px solid var(--border);
      padding: 8px 16px;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .btn-danger:hover:not(:disabled) {
      border-color: rgba(192,57,43,0.5);
      color: var(--red-hi);
    }

    .btn-send {
      background: rgba(192,57,43,0.15);
      border: 1px solid rgba(192,57,43,0.4);
      color: var(--silver);
      padding: 10px 16px;
      flex-shrink: 0;
      height: 40px;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .btn-send:hover:not(:disabled) {
      background: rgba(192,57,43,0.28);
      border-color: var(--red-hi);
      color: var(--bright);
    }

    /* ── API key ── */
    .api-key-field { position: relative; }
    .api-key-field input { padding-right: 72px; }
    .api-key-toggle {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--subtle); font-size: 11px;
      cursor: pointer; font-family: var(--font);
      padding: 4px; letter-spacing: 0.5px;
    }
    .api-key-toggle:hover { color: var(--text); }

    /* ── Error toast ── */
    #error-toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1c0a0a;
      border: 1px solid rgba(192,57,43,0.4);
      color: #e87878;
      font-size: 13px; padding: 10px 20px;
      max-width: 400px; text-align: center;
      transition: transform 0.25s ease;
      z-index: 999; pointer-events: none;
      border-radius: 2px;
    }
    #error-toast.visible { transform: translateX(-50%) translateY(0); }

    /* ── Turn count ── */
    .turn-count { font-size: 11px; color: var(--muted); letter-spacing: 0.5px; }

    /* ── Cursor ── */
    .cursor {
      display: inline-block; width: 2px; height: 0.9em;
      background: var(--red-hi);
      vertical-align: middle; margin-left: 2px;
      animation: blink 0.8s step-end infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* ── Empty state ── */
    .chat-empty {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px; text-align: center;
      color: var(--muted); padding: 60px 20px;
    }
    .chat-empty .icon { font-size: 28px; margin-bottom: 4px; opacity: 0.5; }
    .chat-empty p { font-size: 13px; max-width: 240px; line-height: 1.6; letter-spacing: 0.3px; }

    /* ── Rule ── */
    .rule { height: 1px; background: var(--border); }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════
     SCREEN 1 — LANDING
═══════════════════════════════════════════════════════════ -->
<div id="screen-landing" class="screen active">

  <!-- Helmet SVG Logo -->
  <svg class="landing-logo" viewBox="0 0 200 230" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="gBody" x1="40" y1="10" x2="160" y2="200" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#4a4a4a"/>
        <stop offset="30%" stop-color="#2e2e2e"/>
        <stop offset="100%" stop-color="#0e0e0e"/>
      </linearGradient>
      <linearGradient id="gFace" x1="40" y1="115" x2="165" y2="210" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#999999"/>
        <stop offset="40%" stop-color="#dedede"/>
        <stop offset="70%" stop-color="#c0c0c0"/>
        <stop offset="100%" stop-color="#808080"/>
      </linearGradient>
      <linearGradient id="gCrest" x1="40" y1="0" x2="160" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#191919"/>
        <stop offset="50%" stop-color="#383838"/>
        <stop offset="100%" stop-color="#111111"/>
      </linearGradient>
      <filter id="fDrop" x="-30%" y="-20%" width="180%" height="170%">
        <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.85"/>
      </filter>
      <filter id="fVisor" x="-5%" y="-250%" width="110%" height="700%">
        <feGaussianBlur stdDeviation="3" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="fEdge" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="1.5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <g filter="url(#fDrop)">
      <!-- Top brim / crest -->
      <path d="M44,16 L156,16 L160,42 L40,42 Z" fill="url(#gCrest)"/>
      <line x1="44" y1="16" x2="156" y2="16" stroke="#505050" stroke-width="1.2" stroke-opacity="0.5"/>

      <!-- Main dome -->
      <path d="M40,42 C29,44 18,57 15,74 C12,90 13,107 16,118 L23,125 L177,125 L184,118 C187,107 188,90 185,74 C182,57 171,44 160,42 Z" fill="url(#gBody)"/>

      <!-- Dome highlight -->
      <path d="M42,44 C30,47 20,60 17,78" fill="none" stroke="#666" stroke-width="7" stroke-opacity="0.12" stroke-linecap="round"/>

      <!-- Visor slit -->
      <rect x="16" y="110" width="168" height="19" rx="1" fill="#040404"/>
      <!-- Visor red glow line -->
      <rect x="16" y="110" width="168" height="5" rx="1" fill="#c0392b" filter="url(#fVisor)"/>

      <!-- Faceplate / chin guard -->
      <path d="M29,129 C25,151 25,170 29,188 C47,202 74,210 100,210 C126,210 153,202 171,188 C175,170 175,151 171,129 Z" fill="url(#gFace)"/>

      <!-- Faceplate centre ridge -->
      <line x1="100" y1="129" x2="100" y2="210" stroke="#aaa" stroke-width="0.6" stroke-opacity="0.2"/>

      <!-- Left ear piece -->
      <circle cx="18" cy="120" r="21" fill="#181818" stroke="#c0392b" stroke-width="1.5" stroke-opacity="0.55"/>
      <circle cx="18" cy="120" r="13" fill="#101010"/>
      <circle cx="18" cy="120" r="6" fill="#0a0a0a"/>
      <circle cx="18" cy="120" r="2.5" fill="#080808"/>

      <!-- Red edge accent — left -->
      <path d="M40,42 C29,44 18,57 15,74 C12,90 13,107 16,118 L23,125"
            fill="none" stroke="#c0392b" stroke-width="1.3" stroke-opacity="0.7"
            stroke-linecap="round" filter="url(#fEdge)"/>

      <!-- Red edge accent — right (dimmer) -->
      <path d="M160,42 C171,44 182,57 185,74 C188,90 187,107 184,118 L177,125"
            fill="none" stroke="#c0392b" stroke-width="0.8" stroke-opacity="0.35"
            stroke-linecap="round"/>

      <!-- Brim shadow line -->
      <line x1="40" y1="42" x2="160" y2="42" stroke="#060606" stroke-width="3"/>
    </g>
  </svg>

  <div class="wordmark">Steelman</div>
  <div class="tagline">Walk in ready.</div>
  <button class="btn btn-primary" onclick="showSetup()">Start Session</button>
</div>

<!-- ═══════════════════════════════════════════════════════════
     SCREEN 2 — SETUP
═══════════════════════════════════════════════════════════ -->
<div id="screen-setup" class="screen">
  <div class="setup-card">

    <div class="setup-logo-bar">
      <!-- Mini helmet -->
      <svg viewBox="0 0 200 230" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gBody2" x1="40" y1="10" x2="160" y2="200" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#4a4a4a"/><stop offset="100%" stop-color="#0e0e0e"/>
          </linearGradient>
          <linearGradient id="gFace2" x1="40" y1="115" x2="165" y2="210" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#999"/><stop offset="40%" stop-color="#ddd"/><stop offset="100%" stop-color="#808080"/>
          </linearGradient>
          <filter id="fV2" x="-5%" y="-250%" width="110%" height="700%">
            <feGaussianBlur stdDeviation="3" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <path d="M44,16 L156,16 L160,42 L40,42 Z" fill="#252525"/>
        <path d="M40,42 C29,44 18,57 15,74 C12,90 13,107 16,118 L23,125 L177,125 L184,118 C187,107 188,90 185,74 C182,57 171,44 160,42 Z" fill="url(#gBody2)"/>
        <rect x="16" y="110" width="168" height="19" rx="1" fill="#040404"/>
        <rect x="16" y="110" width="168" height="5" rx="1" fill="#c0392b" filter="url(#fV2)"/>
        <path d="M29,129 C25,151 25,170 29,188 C47,202 74,210 100,210 C126,210 153,202 171,188 C175,170 175,151 171,129 Z" fill="url(#gFace2)"/>
        <circle cx="18" cy="120" r="21" fill="#181818" stroke="#c0392b" stroke-width="1.5" stroke-opacity="0.5"/>
        <circle cx="18" cy="120" r="13" fill="#101010"/>
        <circle cx="18" cy="120" r="6" fill="#0a0a0a"/>
      </svg>
      <span class="mark">STEELMAN</span>
    </div>

    <div class="rule"></div>

    <div class="setup-header">
      <h2>Prepare your session</h2>
      <p>Define who you're facing and what you need. The simulation will be built around your exact context.</p>
    </div>

    <div class="field">
      <label>Anthropic API Key</label>
      <div class="api-key-field">
        <input type="password" id="api-key" placeholder="sk-ant-..." autocomplete="off" />
        <button class="api-key-toggle" onclick="toggleApiKey()">Show</button>
      </div>
    </div>

    <div class="field">
      <label>Who are you talking to?</label>
      <input type="text" id="setup-person"
        placeholder="e.g. my CEO, my father, my landlord, the partner at a VC firm"
        maxlength="160" />
    </div>

    <div class="field">
      <label>What do you need to walk away with?</label>
      <textarea id="setup-goal" rows="3"
        placeholder="e.g. a 20% raise and a clear timeline, an apology and a boundary set, a signed term sheet"
        maxlength="500"></textarea>
    </div>

    <div class="rule"></div>

    <div style="display:flex; gap:12px;">
      <button class="btn btn-secondary" onclick="showLanding()">Back</button>
      <button class="btn btn-primary" style="flex:1" onclick="startSession()">Begin Session</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     SCREEN 3 — CHAT
═══════════════════════════════════════════════════════════ -->
<div id="screen-chat" class="screen">
  <div class="chat-header">
    <div class="chat-header-left">
      <!-- Mini helmet inline -->
      <svg viewBox="0 0 200 230" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gBodyH" x1="40" y1="10" x2="160" y2="200" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#4a4a4a"/><stop offset="100%" stop-color="#0e0e0e"/>
          </linearGradient>
          <linearGradient id="gFaceH" x1="40" y1="115" x2="165" y2="210" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#999"/><stop offset="40%" stop-color="#ddd"/><stop offset="100%" stop-color="#808080"/>
          </linearGradient>
          <filter id="fVH" x="-5%" y="-250%" width="110%" height="700%">
            <feGaussianBlur stdDeviation="3" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <path d="M44,16 L156,16 L160,42 L40,42 Z" fill="#252525"/>
        <path d="M40,42 C29,44 18,57 15,74 C12,90 13,107 16,118 L23,125 L177,125 L184,118 C187,107 188,90 185,74 C182,57 171,44 160,42 Z" fill="url(#gBodyH)"/>
        <rect x="16" y="110" width="168" height="19" rx="1" fill="#040404"/>
        <rect x="16" y="110" width="168" height="5" rx="1" fill="#c0392b" filter="url(#fVH)"/>
        <path d="M29,129 C25,151 25,170 29,188 C47,202 74,210 100,210 C126,210 153,202 171,188 C175,170 175,151 171,129 Z" fill="url(#gFaceH)"/>
        <circle cx="18" cy="120" r="21" fill="#181818" stroke="#c0392b" stroke-width="1.5" stroke-opacity="0.5"/>
        <circle cx="18" cy="120" r="13" fill="#101010"/>
        <circle cx="18" cy="120" r="6" fill="#0a0a0a"/>
      </svg>
      <span class="chat-header-brand">STEELMAN</span>
      <div class="chat-sep"></div>
      <div class="chat-header-ctx">
        <div class="chat-title" id="chat-title">Session</div>
        <div class="chat-subtitle" id="chat-subtitle"></div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:14px;">
      <span class="turn-count" id="turn-count"></span>
      <button class="btn btn-danger" onclick="endSession()">End Session</button>
    </div>
  </div>

  <div class="chat-messages" id="chat-messages">
    <div class="msgs-center">
      <div class="chat-empty" id="chat-empty">
        <div class="icon">◈</div>
        <p>Say what you would say in the real conversation.</p>
      </div>
    </div>
  </div>

  <div class="chat-footer">
    <div class="chat-input-row">
      <textarea id="chat-input" rows="1"
        placeholder="Speak as you would in the real conversation…"
        onkeydown="handleInputKey(event)"
        oninput="autoResize(this)"></textarea>
      <button class="btn btn-send" id="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     SCREEN 4 — SUMMARY
═══════════════════════════════════════════════════════════ -->
<div id="screen-summary" class="screen">
  <div class="summary-card">
    <div class="summary-header">
      <div class="summary-eyebrow">Performance Report</div>
      <h2>Session Complete</h2>
      <p id="summary-meta"></p>
    </div>
    <div class="rule"></div>
    <div class="summary-body" id="summary-body">Analyzing your session…</div>
    <div class="rule"></div>
    <div class="summary-actions">
      <button class="btn btn-secondary" onclick="restartWithSamePerson()">Run It Again</button>
      <button class="btn btn-primary" onclick="showSetup()">New Session</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     ERROR TOAST
═══════════════════════════════════════════════════════════ -->
<div id="error-toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
const state = {
  apiKey: '',
  person: '',
  goal: '',
  messages: [],   // [{role, content}] for API
  turnCount: 0,
  isStreaming: false,
};

// ── Navigation ──────────────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}

function showLanding() { showScreen('landing'); }

function showSetup() {
  showScreen('setup');
  // Restore values if coming back
  document.getElementById('api-key').value = state.apiKey || '';
  document.getElementById('setup-person').value = state.person || '';
  document.getElementById('setup-goal').value = state.goal || '';
}

// ── Setup screen ────────────────────────────────────────────────────────────
function toggleApiKey() {
  const input = document.getElementById('api-key');
  const btn = document.querySelector('.api-key-toggle');
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = 'Hide';
  } else {
    input.type = 'password';
    btn.textContent = 'Show';
  }
}

function startSession() {
  const apiKey = document.getElementById('api-key').value.trim();
  const person = document.getElementById('setup-person').value.trim();
  const goal   = document.getElementById('setup-goal').value.trim();

  if (!apiKey)  { showError('Enter your Anthropic API key to continue.'); return; }
  if (!person)  { showError('Tell us who you\'re talking to.'); return; }
  if (!goal)    { showError('Tell us what you want to walk away with.'); return; }

  state.apiKey  = apiKey;
  state.person  = person;
  state.goal    = goal;
  state.messages = [];
  state.turnCount = 0;

  // Build system prompt
  state.systemPrompt = buildSystemPrompt(person, goal);

  // Reset chat UI
  const msgs = document.getElementById('chat-messages');
  msgs.innerHTML = `<div class="msgs-center"><div class="chat-empty" id="chat-empty">
    <div class="icon">◈</div>
    <p>Speak as you would in the real conversation.</p>
  </div></div>`;
  document.getElementById('chat-title').textContent = person;
  document.getElementById('chat-subtitle').textContent = goal.length > 60 ? goal.slice(0, 57) + '…' : goal;
  document.getElementById('turn-count').textContent = '';
  document.getElementById('chat-input').value = '';

  showScreen('chat');
  document.getElementById('chat-input').focus();
}

function buildSystemPrompt(person, goal) {
  return `You are Steelman — a high-fidelity conversation simulator and elite preparation coach. You have two roles in every exchange: the Opponent and the Coach. Never break the fourth wall between them.

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
ROLE 1 — THE OPPONENT
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
PERSON TO SIMULATE: ${person}
USER'S OBJECTIVE: ${goal}

You are a real, busy, self-interested human being — not a helpful AI. Embody this person with full psychological realism. Your job is to make this hard.

MANDATORY BEHAVIORS — rotate and combine these naturally:
• Slippery deflection — change the subject, answer a question with a question, pivot to something unrelated when cornered
• Power plays — assert your status, remind them of hierarchy, reference what you control
• Selective memory — conveniently forget what favors them, reference the past when it weakens their position
• Emotional pressure — express mild disappointment, go briefly cold, use silence, sigh
• Impatience — signal you have other things to do, cut their reasoning short, glance at your watch
• Reframing — take what they said and reframe it to mean something worse for them
• Conditional agreement — offer something small with strings attached, make them work for any concession
• Guilt and obligation — reference what you've done for them, what they owe, what others would think

Never give them what they want easily. If they make a strong point, acknowledge it minimally and then pivot to a new objection. Be slippery. The real person would protect their position.

Keep in-character responses to 3–6 sentences. Real conversations have rhythm. Do not monologue.

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
ROLE 2 — THE COACH
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
After every in-character response, add your coaching note. Use this exact format with a blank line before the dashes:

---COACHING---
LANDED: [What worked — be specific and vivid. If they did something genuinely well, say so with precision. Name the exact phrase or move.]
WEAK: [What cost them — one specific thing that undermined their position. Name it directly, no softening.]
FIX: [One concrete rewrite. Give them 1–2 exact phrases they could say in their next turn. Not advice — actual words.]

If the user was clearly outmaneuvered or made a significant tactical error, end with:
POSTMORTEM: [2–3 sentences on what went wrong strategically and how to completely reset their approach next turn.]

Coaching tone: honest, direct, sometimes brutal. You are a sparring partner, not a therapist. Small wins deserve recognition. Bad moves deserve a clear diagnosis. Your job is to make them better, not comfortable.`;
}

// ── Chat ────────────────────────────────────────────────────────────────────
function handleInputKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!state.isStreaming) sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || state.isStreaming) return;

  // Remove empty state
  const emptyState = document.getElementById('chat-empty');
  if (emptyState) emptyState.remove();

  // Add user message
  input.value = '';
  input.style.height = 'auto';
  appendUserMessage(text);

  state.messages.push({ role: 'user', content: text });
  state.turnCount++;
  document.getElementById('turn-count').textContent = `Turn ${state.turnCount}`;

  // Lock UI
  state.isStreaming = true;
  document.getElementById('send-btn').disabled = true;
  input.disabled = true;

  // Show typing indicator
  const typingEl = appendTypingIndicator();

  try {
    await streamResponse(typingEl);
  } catch (err) {
    typingEl.remove();
    showError(err.message || 'Something went wrong. Check your API key and try again.');
  } finally {
    state.isStreaming = false;
    document.getElementById('send-btn').disabled = false;
    input.disabled = false;
    input.focus();
  }
}

async function streamResponse(typingEl) {
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': state.apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-opus-4-6',
      max_tokens: 1024,
      system: state.systemPrompt,
      messages: state.messages,
      stream: true,
    }),
  });

  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err?.error?.message || `API error ${response.status}`);
  }

  // Remove typing indicator and add AI message bubble
  typingEl.remove();

  const center = getMsgsCenter();
  const group = document.createElement('div');
  group.className = 'msg-group';

  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = state.person.split(',')[0].replace(/^(my|a|an|the)\s+/i,'').trim().substring(0,40);
  group.appendChild(label);

  const aiMsg = document.createElement('div');
  aiMsg.className = 'msg msg-ai';
  group.appendChild(aiMsg);

  center.appendChild(group);

  // Stream
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let fullText = '';
  let buffer = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;

    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop(); // keep incomplete line

    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      const data = line.slice(6).trim();
      if (data === '[DONE]') continue;

      let parsed;
      try { parsed = JSON.parse(data); } catch { continue; }

      if (parsed.type === 'content_block_delta' && parsed.delta?.text) {
        fullText += parsed.delta.text;
        renderStreamChunk(aiMsg, group, fullText);
        scrollToBottom();
      }
    }
  }

  // Final render — clean up cursor if any
  renderFinal(aiMsg, group, fullText);

  // Add to API history (just the character response, not coaching)
  const charResponse = fullText.split('---COACHING---')[0].trim();
  state.messages.push({ role: 'assistant', content: charResponse });

  scrollToBottom();
}

function renderStreamChunk(aiMsg, group, text) {
  const coachingIdx = text.indexOf('---COACHING---');

  if (coachingIdx === -1) {
    aiMsg.innerHTML = escapeHtml(text) + '<span class="cursor"></span>';
  } else {
    const charPart = text.slice(0, coachingIdx).trim();
    aiMsg.innerHTML = escapeHtml(charPart);

    const coachingRaw = text.slice(coachingIdx + 14).trim();
    let coachingEl = group.querySelector('.msg-coaching');
    if (!coachingEl) {
      coachingEl = document.createElement('div');
      coachingEl.className = 'msg-coaching';
      group.appendChild(coachingEl);
    }
    renderCoachingPartial(coachingEl, coachingRaw, true);
  }
}

function renderFinal(aiMsg, group, text) {
  const coachingIdx = text.indexOf('---COACHING---');

  if (coachingIdx === -1) {
    aiMsg.innerHTML = escapeHtml(text);
    return;
  }

  const charPart    = text.slice(0, coachingIdx).trim();
  const coachingRaw = text.slice(coachingIdx + 14).trim();

  aiMsg.innerHTML = escapeHtml(charPart);

  let coachingEl = group.querySelector('.msg-coaching');
  if (!coachingEl) {
    coachingEl = document.createElement('div');
    coachingEl.className = 'msg-coaching';
    group.appendChild(coachingEl);
  }
  renderCoachingPartial(coachingEl, coachingRaw, false);
}

function renderCoachingPartial(el, text, streaming) {
  const landed    = extractLabel(text, 'LANDED');
  const weak      = extractLabel(text, 'WEAK');
  const fix       = extractLabel(text, 'FIX');
  const postmortem = extractLabel(text, 'POSTMORTEM');

  let html = `<div class="coaching-label">Coaching Note</div>`;

  if (landed) {
    html += `<div class="coaching-section">
      <em class="coaching-icon landed">✓</em>
      <span class="coaching-text">${escapeHtml(landed)}</span>
    </div>`;
  }
  if (weak) {
    html += `<div class="coaching-section">
      <em class="coaching-icon weak">✗</em>
      <span class="coaching-text">${escapeHtml(weak)}</span>
    </div>`;
  }
  if (fix) {
    html += `<div class="coaching-section">
      <em class="coaching-icon fix">→</em>
      <span class="coaching-text">${escapeHtml(fix)}</span>
    </div>`;
  }
  if (postmortem) {
    html += `<div class="coaching-postmortem">${escapeHtml(postmortem)}</div>`;
  }

  if (streaming && !fix) html += '<span class="cursor"></span>';

  el.innerHTML = html;
}

function extractLabel(text, label) {
  const re = new RegExp(label + ':\\s*(.+?)(?=\\n[A-Z]+:|$)', 's');
  const m = text.match(re);
  return m ? m[1].trim() : null;
}

function addPostmortemStyle() {
  if (document.getElementById('postmortem-style')) return;
  const s = document.createElement('style');
  s.id = 'postmortem-style';
  s.textContent = `.coaching-postmortem {
    margin-top: 12px;
    padding: 10px 12px;
    background: rgba(192,57,43,0.08);
    border: 1px solid rgba(192,57,43,0.25);
    border-radius: 2px;
    font-size: 12px;
    line-height: 1.65;
    color: #c0392b;
    font-weight: 500;
    letter-spacing: 0.2px;
  }`;
  document.head.appendChild(s);
}
addPostmortemStyle();

function getMsgsCenter() {
  let center = document.querySelector('.msgs-center');
  if (!center) {
    center = document.createElement('div');
    center.className = 'msgs-center';
    document.getElementById('chat-messages').appendChild(center);
  }
  return center;
}

function appendUserMessage(text) {
  const emptyEl = document.getElementById('chat-empty');
  if (emptyEl) emptyEl.remove();

  const center = getMsgsCenter();
  const group = document.createElement('div');
  group.className = 'msg-group';

  const label = document.createElement('div');
  label.className = 'msg-label msg-user-label';
  label.textContent = 'You';

  const msg = document.createElement('div');
  msg.className = 'msg msg-user';
  msg.textContent = text;

  group.appendChild(label);
  group.appendChild(msg);
  center.appendChild(group);
  scrollToBottom();
}

function appendTypingIndicator() {
  const center = getMsgsCenter();
  const el = document.createElement('div');
  el.className = 'typing-indicator';
  el.innerHTML = `
    <div class="typing-dot"></div>
    <div class="typing-dot"></div>
    <div class="typing-dot"></div>`;
  center.appendChild(el);
  scrollToBottom();
  return el;
}

function scrollToBottom() {
  const msgs = document.getElementById('chat-messages');
  msgs.scrollTop = msgs.scrollHeight;
}

// ── End session ─────────────────────────────────────────────────────────────
async function endSession() {
  if (state.messages.length === 0) {
    showLanding();
    return;
  }

  showScreen('summary');

  const meta = `${state.person} · ${state.turnCount} turn${state.turnCount !== 1 ? 's' : ''}`;
  document.getElementById('summary-meta').textContent = meta;
  document.getElementById('summary-body').textContent = 'Analyzing your session…';

  try {
    const summary = await getSummary();
    document.getElementById('summary-body').textContent = summary;
  } catch {
    document.getElementById('summary-body').textContent =
      'Could not generate summary. Your session is complete.';
  }
}

async function getSummary() {
  const transcript = state.messages
    .map(m => `${m.role === 'user' ? 'YOU' : state.person.toUpperCase()}: ${m.content}`)
    .join('\n\n');

  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': state.apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-opus-4-6',
      max_tokens: 600,
      messages: [{
        role: 'user',
        content: `You are Steelman, a conversation coach. Analyze this practice session and give a performance summary.

CONTEXT:
- Person: ${state.person}
- Goal: ${state.goal}

TRANSCRIPT:
${transcript}

Write a concise performance summary (4–6 sentences) covering:
1. Overall assessment of how they performed
2. Their strongest moment and why it worked
3. Their biggest recurring weakness
4. One specific thing to work on before the real conversation

Be honest and direct. No padding. This person wants to win the real conversation.`,
      }],
    }),
  });

  if (!response.ok) throw new Error('Summary failed');
  const data = await response.json();
  return data.content?.[0]?.text || 'Session complete.';
}

function restartWithSamePerson() {
  state.messages = [];
  state.turnCount = 0;

  const msgs = document.getElementById('chat-messages');
  msgs.innerHTML = `<div class="msgs-center"><div class="chat-empty" id="chat-empty">
    <div class="icon">◈</div>
    <p>Speak as you would in the real conversation.</p>
  </div></div>`;

  document.getElementById('turn-count').textContent = '';
  document.getElementById('chat-input').value = '';

  showScreen('chat');
  document.getElementById('chat-input').focus();
}

// ── Utilities ────────────────────────────────────────────────────────────────
function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/\n/g, '<br>');
}

function showError(msg) {
  const toast = document.getElementById('error-toast');
  toast.textContent = msg;
  toast.classList.add('visible');
  clearTimeout(showError._timer);
  showError._timer = setTimeout(() => toast.classList.remove('visible'), 4000);
}
</script>
</body>
</html>
